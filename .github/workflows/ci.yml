name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go e frontend
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Obter o código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      # main.go embute frontend/dist, que não é versionado: sem o build, go vet falha.
      - name: Gerar o frontend
        working-directory: frontend
        run: npm run build

      - name: Analisar o código Go
        run: go vet ./...

      - name: Testar o código Go
        run: go test ./...

      - name: Verificar tokens visuais
        run: node scripts/check-tokens.mjs

      - name: Verificar lint do frontend
        working-directory: frontend
        run: npm run lint

      - name: Verificar tipos do frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Testar o frontend
        working-directory: frontend
        run: npm test
