<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>OpenHost</title>
    <!--
      Abertura (specs/015): pintada antes de qualquer JS, por isso o CSS fica aqui e as cores são
      as da marca em valor literal (preto piano #050505, laranja do chevron #FD7B17). O React tira
      o #boot quando a primeira tela monta (ui/motion.ts, dismissBoot). Sem script inline (CSP).
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #050505;
        transition: opacity 200ms cubic-bezier(0.4, 0, 1, 1);
      }
      #boot[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }
      #boot svg {
        width: 72px;
        height: 72px;
        overflow: visible;
      }
      #boot .ring {
        fill: #ededed;
        transform-origin: 120px 120px;
        animation: boot-ring 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #boot .chevron {
        fill: #fd7b17;
        animation:
          boot-chevron 420ms cubic-bezier(0.2, 0.8, 0.2, 1) 160ms both,
          boot-pulse 1600ms ease-in-out 600ms infinite alternate;
      }
      @keyframes boot-ring {
        from {
          opacity: 0;
          transform: scale(0.88) rotate(-20deg);
        }
      }
      @keyframes boot-chevron {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
      }
      @keyframes boot-pulse {
        to {
          opacity: 0.55;
        }
      }
      [data-motion='off'] #boot .ring,
      [data-motion='off'] #boot .chevron {
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring,
        #boot .chevron {
          animation: boot-fade 300ms linear both;
        }
        @keyframes boot-fade {
          from {
            opacity: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="56.9 56.9 125.14 126.21" xmlns="http://www.w3.org/2000/svg">
        <path
          class="ring"
          d="M65.6 120C65.6 89.96 89.96 65.6 120 65.6C146.17 65.6 168.02 84.07 173.22 108.69H173.21C173.29 109.06 173.33 109.44 173.33 109.83C173.33 112.87 170.87 115.33 167.83 115.33C165.08 115.33 162.8 113.31 162.39 110.67C158.13 91.18 140.77 76.6 120 76.6C96.03 76.6 76.6 96.03 76.6 120C76.6 143.97 96.03 163.4 120 163.4C140.77 163.4 158.13 148.82 162.39 129.33C162.8 126.69 165.08 124.67 167.83 124.67C170.87 124.67 173.33 127.13 173.33 130.17C173.33 130.56 173.29 130.94 173.21 131.31H173.22C168.02 155.93 146.17 174.4 120 174.4C89.96 174.4 65.6 150.04 65.6 120Z"
        />
        <path
          class="chevron"
          d="M98.5 99C98.5 95.69 101.19 93 104.5 93C106.13 93 107.61 93.65 108.69 94.71L130.19 115.71C131.31 116.8 132 118.32 132 120C132 121.66 131.33 123.16 130.24 124.24C130.23 124.26 130.21 124.28 130.19 124.29L108.7 145.29H108.69C107.61 146.35 106.13 147 104.5 147C101.19 147 98.5 144.31 98.5 141C98.5 139.32 99.19 137.8 100.31 136.71V136.7L117.41 120L100.31 103.29C99.19 102.2 98.5 100.68 98.5 99Z"
        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
